<!DOCTYPE html>
<html>
<head>
  <script>
    // Redirección inteligente para GitHub Pages
    const path = window.location.pathname;
    if(path.includes('tercerparcial')) {
      window.location.href = '/tercerparcial/#' + path.split('tercerparcial')[1];
    } else {
      window.location.href = '/tercerparcial/#/';
    }
  </script>
</head>
<body>
  <p>Redireccionando...</p>
</body>
</html>
